<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfcfb">
<title>记忆库 · 原型</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/400.min.css" rel="stylesheet" media="print" onload="this.media='all'" onerror="this.remove()">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5/500.min.css" rel="stylesheet" media="print" onload="this.media='all'" onerror="this.remove()">
<style>
  :root{
    --paper:#fbfcfb;
    --paper-2:#f4f6f4;
    --ink:#212a27;
    --ink-2:#39433f;
    --muted:#7d8783;
    --faint:#a2a9a6;
    --line:#e2e5e3;
    --line-2:#d9dedb;
    --blue:#1834d4;
    --gold:#ad9460;
    --serif:"Cormorant Garamond","Noto Serif CJK SC","Noto Serif CJK TC","Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --body:Georgia,"Noto Serif CJK SC","Songti SC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#e8ebe8;font-family:var(--body);color:var(--ink);
    display:flex;justify-content:center;
  }
  .app{
    position:relative;width:100%;max-width:480px;height:100dvh;overflow:hidden;
    background:var(--paper);
    box-shadow:0 0 60px rgba(30,40,36,.16);
  }
  .app::before{
    content:"";position:absolute;inset:0 0 auto;height:220px;pointer-events:none;
    background:radial-gradient(120% 100% at 50% -30%,rgba(255,255,255,.9),rgba(251,252,251,0) 70%);
  }
  .scroll{
    position:absolute;inset:0 0 0;overflow-y:auto;overflow-x:hidden;
    padding:calc(18px + env(safe-area-inset-top)) 22px calc(96px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  .scroll::-webkit-scrollbar{width:0}

  /* ---------- head ---------- */
  .kicker{
    display:flex;align-items:center;justify-content:space-between;
    font-size:9.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;
  }
  .kicker .l{display:flex;align-items:center;gap:9px}
  .kicker .num{color:var(--ink-2);letter-spacing:.08em}
  .kicker .tag{
    font-size:8.5px;letter-spacing:.14em;padding:2px 5px;border:.7px solid var(--line-2);
    border-radius:3px;color:var(--faint);
  }
  .kicker .r{font-size:10px;letter-spacing:.08em;color:var(--muted);font-family:var(--body)}
  h1{
    margin:14px 0 0;font-family:var(--serif);font-weight:400;
    font-size:40px;line-height:1.05;letter-spacing:.03em;color:var(--ink);
  }
  .sub{
    margin:12px 0 0;padding-left:12px;border-left:1.2px solid var(--ink);
    font-size:12px;line-height:1.8;color:var(--muted);letter-spacing:.02em;
  }
  .counts{display:flex;gap:14px;margin:16px 0 0;font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
  .counts b{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-right:3px}

  /* ---------- controls ---------- */
  .seg{
    margin:20px 0 0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
    padding:3px;border:.7px solid var(--line-2);border-radius:7px;background:rgba(238,242,240,.7);
  }
  .seg button{
    min-height:34px;border:0;border-radius:5px;background:transparent;
    font-family:var(--body);font-size:12px;letter-spacing:.06em;color:#7b8581;
  }
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(42,53,49,.08)}

  .search{
    margin:16px 0 0;display:flex;align-items:center;gap:9px;
    padding:0 2px 10px;border-bottom:.7px solid var(--line);
  }
  .search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.5;flex:none}
  .search input{
    flex:1;min-width:0;border:0;background:none;outline:none;
    font-family:var(--body);font-size:14px;color:var(--ink);letter-spacing:.01em;
  }
  .search input::placeholder{color:#a9b0ad}
  .search .clear{display:none;border:0;background:none;padding:2px;color:var(--faint);font-size:15px;line-height:1}
  .search.has .clear{display:block}

  .chips{
    display:flex;gap:7px;overflow-x:auto;padding:13px 0 3px;margin:0 -22px;
    padding-left:22px;padding-right:22px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:.7px solid var(--line-2);background:transparent;border-radius:20px;
    padding:5px 11px;font-family:var(--body);font-size:11px;letter-spacing:.04em;color:#6f7a76;
    white-space:nowrap;
  }
  .chip small{margin-left:4px;color:#a7aeab;font-size:10px;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#f6f8f6}
  .chip.on small{color:rgba(255,255,255,.55)}

  /* ---------- list ---------- */
  .stream{position:relative;margin:16px 0 0;padding-left:18px;border-left:.8px solid #e3e7e4}
  .entry{
    position:relative;display:block;width:100%;text-align:left;border:0;background:none;
    padding:0 0 22px;cursor:pointer;
  }
  .entry:last-child{padding-bottom:6px}
  .entry::before{
    content:"";position:absolute;left:-21.2px;top:7px;width:5.5px;height:5.5px;border-radius:50%;
    background:var(--blue);
  }
  .entry.sunk::before{background:#c3c9c6}
  .entry.fav::before{background:var(--gold)}
  .entry .meta{
    display:flex;align-items:center;gap:8px;
    font-size:9.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;
  }
  .entry .meta .d{color:var(--ink-2);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .entry .meta .st{font-size:9px;letter-spacing:.1em;padding:1.5px 5px;border-radius:3px;border:.7px solid var(--line-2);color:#8b948f}
  .entry.sunk .meta .st{color:#a7aeab}
  .entry .meta .pin{color:var(--gold);font-size:10px;letter-spacing:.1em}
  .entry h2{
    margin:7px 0 0;font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.4;
    letter-spacing:.02em;color:var(--ink);
  }
  .entry.sunk h2{color:#6d7672}
  .entry p{
    margin:5px 0 0;font-size:12.5px;line-height:1.85;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .entry .cues{display:flex;gap:5px;margin:9px 0 0;flex-wrap:wrap}
  .entry .cues span{
    font-size:10px;letter-spacing:.04em;color:#8d9591;background:#f1f3f1;
    border-radius:3px;padding:2px 6px;
  }
  .entry .foot{margin:9px 0 0;font-size:9.5px;letter-spacing:.1em;color:#b0b7b4}

  .empty{padding:54px 8px;text-align:center}
  .empty b{display:block;font-family:var(--serif);font-size:19px;font-weight:400;color:#8d9591}
  .empty span{display:block;margin-top:8px;font-size:11.5px;letter-spacing:.04em;color:#b0b7b4}

  /* ---------- detail ---------- */
  .detail{
    position:absolute;inset:0;z-index:40;background:var(--paper);
    display:flex;flex-direction:column;
    transform:translateX(100%);opacity:0;pointer-events:none;
    transition:transform .32s cubic-bezier(.25,.8,.3,1),opacity .2s;
  }
  .detail.on{transform:none;opacity:1;pointer-events:auto}
  .dhead{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    border-bottom:.7px solid var(--line);
  }
  .dhead .back{
    width:34px;height:34px;border:0;background:none;display:grid;place-items:center;
    color:var(--ink-2);margin-left:-4px;
  }
  .dhead .back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .dhead .kind{flex:1;font-size:9.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .dhead .fav{
    width:34px;height:34px;border:0;background:none;display:grid;place-items:center;color:#b9c0bd;
  }
  .dhead .fav.on{color:var(--gold)}
  .dhead .fav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4}
  .dhead .fav.on svg{fill:currentColor;fill-opacity:.18}

  .dbody{flex:1;min-height:0;overflow-y:auto;padding:20px 24px calc(110px + env(safe-area-inset-bottom))}
  .dbody::-webkit-scrollbar{width:0}
  .dbody .meta{
    display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.14em;
    color:var(--faint);text-transform:uppercase;
  }
  .dbody .meta .d{color:var(--ink-2);letter-spacing:.06em}
  .dbody h1{margin:12px 0 0;font-size:29px;line-height:1.32;letter-spacing:.02em}
  .dbody .prose{margin:18px 0 0;font-size:15px;line-height:2.05;color:#3a443f;letter-spacing:.01em}
  .dbody .prose p{margin:0 0 14px}
  .dbody .prose p:last-child{margin-bottom:0}
  .sect{margin:30px 0 0}
  .sect > h3{
    margin:0 0 12px;font-size:9.5px;letter-spacing:.2em;color:var(--faint);
    text-transform:uppercase;font-weight:400;display:flex;align-items:center;gap:8px;
  }
  .sect > h3::after{content:"";flex:1;height:.7px;background:var(--line)}
  .cue{display:flex;flex-wrap:wrap;gap:7px}
  .cue button{
    border:.7px solid var(--line-2);background:#fff;border-radius:4px;
    padding:5px 9px;font-family:var(--body);font-size:11.5px;color:#5f6a66;letter-spacing:.03em;
  }
  .cue .add{border-style:dashed;color:#a7aeab;background:transparent}
  .quote{
    padding:12px 14px 12px 15px;background:#f5f7f5;border-left:1.2px solid var(--blue);
    font-size:13px;line-height:1.95;color:#4c5752;
  }
  .quote i b.lnk{float:right;font-weight:400;color:#8fa7ff;letter-spacing:.04em}
.quote i{display:block;margin-top:8px;font-style:normal;font-size:10px;letter-spacing:.08em;color:#9aa29e}
  .rel{display:flex;flex-direction:column;gap:10px}
  .rel .row{display:flex;align-items:baseline;gap:9px;font-size:12px;color:#5f6a66}
  .rel .row em{font-style:normal;font-size:9.5px;letter-spacing:.12em;color:var(--faint);flex:none}
  .rel .row span{font-family:var(--serif);font-size:14px;color:var(--ink-2)}
  .note{display:flex;gap:11px;padding:9px 0;border-bottom:.7px solid #eef1ef;font-size:12px;line-height:1.8;color:#5a6560}
  .note:last-child{border:0}
  .note time{flex:none;font-size:9.5px;letter-spacing:.08em;color:#aab1ae;padding-top:3px;font-variant-numeric:tabular-nums}

  .dacts{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;gap:9px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(251,252,251,0),rgba(251,252,251,.94) 36%);
  }
  .dacts button{
    flex:1;min-height:42px;border:.7px solid var(--line-2);border-radius:6px;background:#fff;
    font-family:var(--body);font-size:12px;letter-spacing:.06em;color:#4e5954;
  }
  .dacts button.danger{color:#a35b5b;border-color:#e8d7d7;background:#fdf8f8}
  .dacts button.solid{background:var(--ink);border-color:var(--ink);color:#f6f8f6}

  /* ---------- tabbar ---------- */
  .tabs{
    position:absolute;left:0;right:0;bottom:0;z-index:30;
    display:flex;padding:7px 8px calc(6px + env(safe-area-inset-bottom));
    background:rgba(251,252,251,.92);border-top:.7px solid var(--line);
    backdrop-filter:blur(16px);
  }
  .tab{
    flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:5px 0 2px;color:#b3bab7;
  }
  .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .tab span{font-size:9px;letter-spacing:.1em;font-family:var(--body)}
  .tab.on{color:var(--ink)}

  .toast{
    position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    background:rgba(33,42,39,.94);color:#f4f6f4;font-size:11.5px;letter-spacing:.04em;
    padding:9px 15px;border-radius:20px;opacity:0;pointer-events:none;transition:all .26s;z-index:60;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<script>

  {

    ev:{text:'「冷了吧。」', from:'10.05 23:02 · 便利店门口'},

    notes:[]

  {

const EVENTS = [

  { id:'e3', d:'2026.10.26', w:'周日', status:'正在使用', fav:false,

    cues:['旧手机','照片','三个小时'], ev:{text:'「我导出来了，好多。」', from:'09.30 23:41'}, rel:[], notes:[] }

const PREFS = [
  { id:'p1', d:'2026.10.20', w:'周一', status:'正在使用', fav:true, kind:'不喜欢', about:'关于你',
    title:'香菜',
    body:['她不会明说，但会把香菜一根一根挑出来。','点外卖时如果没备注，她也会吃，只是吃得很慢。'],

    cues:['隔夜','气话'], rel:[], notes:[] }
];

/* ============ 状态 ============ */
const TYPES = [
  {k:'scene', label:'场景', list:SCENES, ph:'搜索 Scene…', sub:'Scene 按发生时间排列，保留它们原来的语气。'},
  {k:'event', label:'事件', list:EVENTS, ph:'搜索事件标题或正文…', sub:'事件只记录经过，不替你们判断它意味着什么。'},
  {k:'pref',  label:'喜好', list:PREFS,  ph:'搜索喜好…', sub:'喜好是他对你的判断，短小、具体，带着来源。'}
];
let type = 0, chip = 'all', q = '', cur = null, opened = false;

const $ = s => document.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

const CHIPS = {
  scene: [ {k:'all',t:'全部'}, {k:'live',t:'可浮现'}, {k:'sunk',t:'已沉底'}, {k:'fav',t:'舍不得'}, {k:'open',t:'未了'} ],
  event: [ {k:'all',t:'正在使用'}, {k:'arch',t:'已归档'}, {k:'fav',t:'舍不得'} ],
  pref:  [ {k:'all',t:'全部'}, {k:'like',t:'喜欢'}, {k:'dislike',t:'不喜欢'}, {k:'fav',t:'舍不得'} ]
};

function pool(){
  const t = TYPES[type];
  let list = t.list.slice();
  if (chip === 'live') list = list.filter(x => x.status === '可浮现');
  if (chip === 'sunk') list = list.filter(x => x.status === '已沉底');
  if (chip === 'arch') list = list.filter(x => x.status === '已归档');
  if (chip === 'open') list = list.filter(x => x.open);
  if (chip === 'like') list = list.filter(x => x.kind === '喜欢');
  if (chip === 'dislike') list = list.filter(x => x.kind === '不喜欢');
  if (chip === 'fav') list = list.filter(x => x.fav);
  const kw = q.trim().toLowerCase();
  if (kw){
    list = list.filter(x => (
      (x.title || '') + ' ' + (x.excerpt || '') + ' ' + (x.body || []).join(' ') + ' ' + (x.cues || []).join(' ')
    ).toLowerCase().indexOf(kw) >= 0);
  }
  return list;
}

function renderHead(){
  const t = TYPES[type];
  $('#sub').textContent = t.sub;
  $('#q').placeholder = t.ph;
  const s = SCENES.length, e = EVENTS.length, p = PREFS.length;
  $('#counts').innerHTML = '<span><b>' + s + '</b>个场景</span><span><b>' + e + '</b>个事件</span><span><b>' + p + '</b>条喜好</span>';

  $('#seg').innerHTML = TYPES.map((x, i) =>
    '<button class="' + (i === type ? 'on' : '') + '" data-t="' + i + '">' + x.label + '</button>'
  ).join('');

  const counts = {};
  t.list.forEach(x => {
    if (x.status) counts[x.status] = (counts[x.status] || 0) + 1;
    if (x.open) counts.__open = (counts.__open || 0) + 1;
    if (x.fav) counts.__fav = (counts.__fav || 0) + 1;
    if (x.kind === '喜欢') counts.__like = (counts.__like || 0) + 1;
    if (x.kind === '不喜欢') counts.__dislike = (counts.__dislike || 0) + 1;
  });
  $('#chips').innerHTML = CHIPS[t.k].map(c => {
    let n = '';
    if (c.k === 'live') n = counts['可浮现'];
    if (c.k === 'sunk') n = counts['已沉底'];
    if (c.k === 'arch') n = counts['已归档'];
    if (c.k === 'open') n = counts.__open;
    if (c.k === 'fav') n = counts.__fav;
    if (c.k === 'all') n = t.list.length;
    if (c.k === 'like') n = counts.__like;
    if (c.k === 'dislike') n = counts.__dislike;
    return '<button class="chip' + (chip === c.k ? ' on' : '') + '" data-c="' + c.k + '">' + c.t +
      (n ? '<small>' + n + '</small>' : '') + '</button>';
  }).join('');
}

function renderList(){
  const list = pool();
  const box = $('#stream');
  if (!list.length){
    box.innerHTML = '<div class="empty"><b>' + (q ? '没有找到。' : '这一页还是空的。') + '</b><span>' +
      (q ? '换一个词再试试。' : '他会在相处里，慢慢把这里填满。') + '</span></div>';
    return;
  }
  box.innerHTML = list.map(x => {
    const sunk = x.status === '已沉底' || x.status === '已归档';
    const cls = 'entry' + (sunk ? ' sunk' : '') + (x.fav ? ' fav' : '');
    const st = x.kind ? (x.about + ' · ' + x.kind) : (x.status || '');
    const cues = (x.cues || []).slice(0, 3).map(c => '<span>' + c + '</span>').join('');
    const isEvent = x.id.charAt(0) === 'e';
    const foot = x.kind
      ? ((x.cues || []).length + ' 个关键词')
      : isEvent
        ? ((x.cues || []).length + ' 个关键词')
        : ((x.cues || []).length + ' 条线索' + ((x.rel || []).length ? ' · ' + x.rel.length + ' 段关系' : ''));
    return '<button class="' + cls + '" data-id="' + x.id + '">' +
      '<div class="meta"><span class="d">' + x.d + '</span><span>' + x.w + '</span><span class="st">' + st + '</span>' +
      (x.fav ? '<span class="pin">✦</span>' : '') + '</div>' +
      '<h2>' + x.title + '</h2>' +
      '<p>' + (x.excerpt || (x.body || [])[0] || '') + '</p>' +
      (cues ? '<div class="cues">' + cues + '</div>' : '') +
      '<div class="foot">' + foot + '</div>' +
      '</button>';
  }).join('');
}

function find(id){
  return SCENES.concat(EVENTS, PREFS).filter(x => x.id === id)[0];
}

function renderDetail(x){
  cur = x;
  const isScene = SCENES.indexOf(x) >= 0;
  const isPref = PREFS.indexOf(x) >= 0;
  $('#dkind').textContent = isScene ? 'Scene · 场景' : (isPref ? '喜好 · ' + x.about : '事件');
  $('#dfav').classList.toggle('on', !!x.fav);
  const metas = (x.kind ? (x.about + ' · ' + x.kind) : x.status);
  let h = '<div class="meta"><span class="d">' + x.d + '</span><span>' + x.w + '</span><span>' + metas + '</span></div>';
  h += '<h1>' + x.title + '</h1>';
  h += '<div class="prose">' + (x.body || []).map(p => '<p>' + p + '</p>').join('') + '</div>';

  if (isScene){
    h += '<div class="sect"><h3>线索 · Cues</h3><div class="cue">' +
      (x.cues || []).map(c => '<button data-cue="' + c + '">' + c + '</button>').join('') +
      '<button class="add">+ 加一条</button></div></div>';
  } else if (isPref){
    h += '<div class="sect"><h3>关键词</h3><div class="cue">' +
      (x.cues || []).map(c => '<button data-cue="' + c + '">' + c + '</button>').join('') + '</div></div>';
  }

  if (x.ev){
    h += '<div class="sect"><h3>证据 · 原话</h3><div class="quote">' +
      x.ev.text.replace(/\n/g, '<br>') + '<i>' + x.ev.from + '<b class="lnk">看原对话 ›</b></i></div></div>';
  }
  if (isScene && (x.rel || []).length){
    h += '<div class="sect"><h3>关系</h3><div class="rel">' +
      x.rel.map(r => '<div class="row"><em>' + r.k + '</em><span>' + r.t + '</span></div>').join('') +
      '</div></div>';
  }
  if ((x.notes || []).length){
    h += '<div class="sect"><h3>旁注</h3>' +
      x.notes.map(n => '<div class="note"><time>' + n.d + '</time><div>' + n.t + '</div></div>').join('') +
      '</div>';
  }
  $('#dbody').innerHTML = h;
  $('#dbody').scrollTop = 0;

  $('#dacts').innerHTML = isPref
    ? '<button data-act="fav">' + (x.fav ? '取消舍不得' : '舍不得丢') + '</button>' +
      '<button class="solid" data-act="edit">编辑这条</button>'
    : '<button data-act="fav">' + (x.fav ? '取消舍不得' : '舍不得丢') + '</button>' +
      '<button data-act="sink">' + (x.status === '已沉底' || x.status === '已归档' ? '恢复可浮现' : '沉底') + '</button>' +
      '<button class="danger" data-act="del">删除</button>';
}

function open(id){
  const x = find(id);
  if (!x) return;
  renderDetail(x);
  $('#detail').classList.add('on');
  opened = true;
}
function close(){
  $('#detail').classList.remove('on');
  opened = false;
}

function toast(t){
  const b = $('#toast');
  b.textContent = t;
  b.classList.add('on');
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('on'), 1700);
}

/* ============ 事件 ============ */
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  type = Number(b.dataset.t);
  chip = 'all'; q = ''; $('#q').value = ''; $('#searchWrap').classList.remove('has');
  renderHead(); renderList();
});

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]');
  if (!b) return;
  chip = b.dataset.c;
  renderHead(); renderList();
});

$('#q').addEventListener('input', e => {
  q = e.target.value;
  $('#searchWrap').classList.toggle('has', !!q);
  renderList();
});
$('#clearQ').addEventListener('click', () => {
  q = ''; $('#q').value = ''; $('#searchWrap').classList.remove('has'); renderList();
});

$('#stream').addEventListener('click', e => {
  const b = e.target.closest('.entry');
  if (b) open(b.dataset.id);
});

$('#back').addEventListener('click', close);
$('#detail').addEventListener('click', e => {
  const cue = e.target.closest('button[data-cue]');
  if (cue){ toast('按这条线索去翻原对话（原型）'); return; }
  if (e.target.closest('.cue .add')){ toast('加一条线索（原型）'); return; }

  const act = e.target.closest('button[data-act]');
  if (!act || !cur) return;
  const a = act.dataset.act;
  if (a === 'fav'){ cur.fav = !cur.fav; renderDetail(cur); renderList(); toast(cur.fav ? '收进「舍不得丢的」' : '已移出'); }
  if (a === 'sink'){
    if (cur.status === '已沉底' || cur.status === '已归档'){ cur.status = SCENES.indexOf(cur) >= 0 ? '可浮现' : '正在使用'; }
    else { cur.status = SCENES.indexOf(cur) >= 0 ? '已沉底' : '已归档'; }
    renderDetail(cur); renderList(); toast('状态已改 · ' + cur.status);
  }
  if (a === 'del'){ toast('原型里不真的删除'); }
  if (a === 'edit'){ toast('编辑（下一步）'); }
});

$('#dfav').addEventListener('click', () => {
  if (!cur) return;
  cur.fav = !cur.fav;
  cur.fav ? $('#dfav').classList.add('on') : $('#dfav').classList.remove('on');
  renderList();
  toast(cur.fav ? '收进「舍不得丢的」' : '已移出');
});

document.querySelectorAll('.tabs .tab').forEach(t => t.addEventListener('click', () => {
  if (!t.classList.contains('on')) toast('原型里只做了「记忆」这一页');
}));

renderHead();
renderList();
</script>
